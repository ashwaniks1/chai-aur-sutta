<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Chai aur Sutta ❤️ — 90s & 2000s Bollywood Radio</title>
  <meta name="description" content="Chai aur Sutta — non-stop 90s & 2000s Bollywood hits from the tapri speaker. Kumar Sanu se KK tak." />
  <meta name="theme-color" content="#1a1008" />

  <meta property="og:type" content="music.playlist" />
  <meta property="og:title" content="Chai aur Sutta ❤️ — 90s & 2000s Bollywood Radio" />
  <meta property="og:description" content="Tapri wali chai. Gali wale gaane. Stream full 90s & 2000s Bollywood classics." />
  <meta property="og:image" content="hero-bg.jpg" />

  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>

  <div class="hero-bg" aria-hidden="true"></div>

  <div class="shell">

    <header class="topbar" role="banner">
      <div class="topbar-clock" id="topbar-clock" aria-label="Current time">
        <span id="clock-display">--:--</span>
      </div>

      <div class="topbar-center">
        <div class="live-pill" role="status" aria-label="Live listeners">
          <span class="dot-wrap" aria-hidden="true">
            <span class="dot-ping"></span>
            <span class="dot-core"></span>
          </span>
          <span id="live-count" class="live-number" aria-live="polite">24</span>
          <span class="live-label">online</span>
        </div>
      </div>

      <nav class="topbar-right" id="topbar-links" aria-label="External links"></nav>
    </header>

    <main class="hero-center" aria-label="Now playing">
      <p class="station-name" id="station-name">Chai aur Sutta</p>
      <p class="station-tagline" id="station-tagline">Tapri wali chai. Gali wale gaane.</p>
    </main>

    <div class="player-wrap" role="region" aria-label="Music player">
      <div class="player-card glass-panel" id="player-card">

        <div class="art-wrap">
          <img id="art-img" src="" alt="Album artwork" class="art-img" />
          <div class="art-placeholder" id="art-placeholder">
            <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true">
              <path d="M12 3v10.55A4 4 0 1014 17V7h4V3z"/>
            </svg>
          </div>
        </div>

        <div class="player-body">
          <div class="track-meta">
            <p class="track-name" id="track-name">Loading radio…</p>
            <p class="track-artist" id="track-artist">Chai aur Sutta — 90s & 2000s Bollywood</p>
          </div>

          <div class="seek-group" role="group" aria-label="Seek progress">
            <div class="seek-bar" id="seek-bar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
              <div class="seek-track">
                <div class="seek-fill" id="seek-fill"></div>
              </div>
            </div>
            <div class="seek-times">
              <span id="time-cur">0:00</span>
              <span class="time-sep">/</span>
              <span id="time-tot">0:00</span>
            </div>
          </div>
        </div>

        <div class="controls" role="group" aria-label="Playback controls">
          <button class="ctrl-sm" id="btn-prev" aria-label="Previous track" title="Previous">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <button class="ctrl-lg" id="btn-play" aria-label="Play" aria-pressed="false" title="Play / Pause" disabled>
            <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
          </button>

          <button class="ctrl-sm" id="btn-next" aria-label="Next track" title="Next">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
          </button>
        </div>

      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
